name: Release

# 打 v* tag 时在 GitHub 上编译 Gallery 与 SDK 并发布 Release。
# lumatext 是私有仓库，CI 不编译它：直接使用 lumatext-deps Release 上的预编译产物
# （include/ + bin/lumatext.dll + lib/lumatext.lib + lib/cmake/LumaText），经
# find_package(LumaText) 以 LumaText::Shared 接入。升级产物后同步更新 URL 与 SHA256。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      LUMATEXT_PREBUILT_URL: https://github.com/jimmgreen/LUMENUI/releases/download/lumatext-deps/lumatext-prebuilt-20260906.zip
      LUMATEXT_PREBUILT_SHA256: FEAD9871FC68C341E537B437800D22E1E0B8D7F86884D6427A7C8A7423C047A3
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt lumatext
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "$env:LUMATEXT_PREBUILT_URL" -OutFile lumatext-prebuilt.zip
          $hash = (Get-FileHash lumatext-prebuilt.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:LUMATEXT_PREBUILT_SHA256) { throw "lumatext prebuilt hash mismatch: $hash" }
          Expand-Archive lumatext-prebuilt.zip -DestinationPath _deps
          # 预编译包在 UTC+8 机器打包，UTC runner 解出的 mtime 在未来，CMake 会无限重生成
          # （ninja: manifest 'build.ninja' still dirty after 100 tries）。钳到当前时间。
          $clamp = (Get-Date).AddMinutes(-5)
          Get-ChildItem _deps -Recurse -File | ForEach-Object { $_.LastWriteTime = $clamp }
          Get-ChildItem _deps -Recurse -Directory | ForEach-Object { $_.LastWriteTime = $clamp }
          "LUMATEXT_PREFIX=$PWD/_deps/lumatext-prebuilt" >> $env:GITHUB_ENV

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DLUMEN_WITH_LUMATEXT=ON -DLUMEN_REQUIRE_LUMATEXT=ON `
            -DLUMEN_USE_PREBUILT_LUMATEXT=ON `
            -DCMAKE_PREFIX_PATH="$env:LUMATEXT_PREFIX" `
            -DLUMEN_BUILD_TESTS=OFF
          cmake --build build

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --prefix dist/sdk
          New-Item -ItemType Directory dist/sdk/licenses/LumaText -Force | Out-Null
          Copy-Item "$env:LUMATEXT_PREFIX/licenses/*" dist/sdk/licenses/LumaText/
          $gallery = "dist/gallery"
          New-Item -ItemType Directory $gallery | Out-Null
          Copy-Item build/lumen_gallery.exe $gallery/
          Copy-Item build/lumatext.dll $gallery/
          if (Test-Path build/licenses) { Copy-Item build/licenses $gallery -Recurse }
          else { Copy-Item dist/sdk/licenses $gallery -Recurse }
          # runner 镜像可能是 VS2022 或 VS2026（"18"），按年号通配取最新一份 CRT。
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "VC redist CRT directory not found" }
          Copy-Item "$($crt.FullName)/*.dll" $gallery/
          Compress-Archive -Path "$gallery/*" -DestinationPath lumen-gallery-windows-x64.zip
          Compress-Archive -Path "dist/sdk/*" -DestinationPath lumen-sdk-windows-x64.zip

      - name: Audit release packages for private paths and credentials
        shell: pwsh
        run: python tools/audit_release.py lumen-gallery-windows-x64.zip lumen-sdk-windows-x64.zip

      - name: Extract release notes
        shell: pwsh
        run: python tools/extract_changelog.py ${{ github.ref_name }} release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            lumen-gallery-windows-x64.zip
            lumen-sdk-windows-x64.zip
