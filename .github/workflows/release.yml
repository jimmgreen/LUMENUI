name: Release

# 打 v* tag 时在 GitHub 上编译 Gallery 与 SDK 并发布 Release。
# CI 不编译 LumaText：直接使用仓库 third_party/lumatext 中固定的预编译产物
# （include/ + bin/lumatext.dll + lib/lumatext.lib + lib/cmake/LumaText），经
# find_package(LumaText) 以 LumaText::Shared 接入。升级产物时同步更新 SHA256SUMS。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundled LumaText
        shell: pwsh
        run: |
          Get-Content third_party/lumatext/SHA256SUMS | ForEach-Object {
            $expected, $relative = $_ -split '  ', 2
            $actual = (Get-FileHash "third_party/lumatext/$relative" -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw "LumaText checksum mismatch: $relative" }
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DLUMEN_WITH_LUMATEXT=ON -DLUMEN_REQUIRE_LUMATEXT=ON `
            -DLUMEN_USE_PREBUILT_LUMATEXT=ON `
            -DLUMEN_BUILD_TESTS=OFF
          cmake --build build

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --prefix dist/sdk
          $gallery = "dist/gallery"
          New-Item -ItemType Directory $gallery | Out-Null
          Copy-Item build/lumen_gallery.exe $gallery/
          Copy-Item build/lumatext.dll $gallery/
          if (Test-Path build/licenses) { Copy-Item build/licenses $gallery -Recurse }
          else { Copy-Item dist/sdk/licenses $gallery -Recurse }
          # runner 镜像可能是 VS2022 或 VS2026（"18"），按年号通配取最新一份 CRT。
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "VC redist CRT directory not found" }
          Copy-Item "$($crt.FullName)/*.dll" $gallery/
          Compress-Archive -Path "$gallery/*" -DestinationPath lumen-gallery-windows-x64.zip
          Compress-Archive -Path "dist/sdk/*" -DestinationPath lumen-sdk-windows-x64.zip

      - name: Audit release packages for private paths and credentials
        shell: pwsh
        run: python tools/audit_release.py lumen-gallery-windows-x64.zip lumen-sdk-windows-x64.zip

      - name: Extract release notes
        shell: pwsh
        run: python tools/extract_changelog.py ${{ github.ref_name }} release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            lumen-gallery-windows-x64.zip
            lumen-sdk-windows-x64.zip
